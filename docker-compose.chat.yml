x-agent-environment: &agent-environment
    DATABASE_URL: postgresql+psycopg://agent_runtime:${AGENT_DATABASE_PASSWORD:?Set AGENT_DATABASE_PASSWORD}@agent-postgres:5432/agent
    FINANCE_AGENT_SERVICE_TOKEN: ${FINANCE_AGENT_SERVICE_TOKEN:?Set FINANCE_AGENT_SERVICE_TOKEN}
    AGENT_MCP_SERVICE_TOKEN: ${AGENT_MCP_SERVICE_TOKEN:?Set AGENT_MCP_SERVICE_TOKEN}
    MCP_URL: http://agent-mcp:8080/mcp
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    AGENT_MODEL: ${AGENT_MODEL:-}
    AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-https://openrouter.ai/api/v1}
    AGENT_RETENTION_DAYS: ${AGENT_RETENTION_DAYS:-30}

services:
    php:
        environment:
            CHAT_ENABLED: ${CHAT_ENABLED:-false}
            CHAT_AGENT_URL: http://agent-api:8000
            FINANCE_AGENT_SERVICE_TOKEN: ${FINANCE_AGENT_SERVICE_TOKEN:?Set FINANCE_AGENT_SERVICE_TOKEN}
        networks:
            - chat_gateway

    mysql:
        healthcheck:
            test: [CMD, mysqladmin, ping, -h127.0.0.1, --silent]
            interval: 5s
            timeout: 5s
            retries: 30
        networks:
            - mcp_finance_data

    agent-postgres:
        image: postgres:17-bookworm
        profiles: [chat]
        environment:
            POSTGRES_DB: agent
            POSTGRES_USER: agent_owner
            POSTGRES_PASSWORD: ${AGENT_DATABASE_OWNER_PASSWORD:?Set AGENT_DATABASE_OWNER_PASSWORD}
            AGENT_DATABASE_PASSWORD: ${AGENT_DATABASE_PASSWORD:?Set AGENT_DATABASE_PASSWORD}
        volumes:
            - agent_state:/var/lib/postgresql/data
            - ./docker/chat/init-postgres.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U agent_owner -d agent']
            interval: 5s
            timeout: 5s
            retries: 20
        networks: [agent_state]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped

    agent-migrate:
        build:
            context: .
            dockerfile: docker/agents/Dockerfile
        image: fin-si-agent:local
        profiles: [chat-setup]
        environment:
            <<: *agent-environment
            DATABASE_URL: postgresql+psycopg://agent_owner:${AGENT_DATABASE_OWNER_PASSWORD:?Set AGENT_DATABASE_OWNER_PASSWORD}@agent-postgres:5432/agent
        command: [sh, -c, 'alembic upgrade head && python -m finance_agent.setup_checkpoints']
        networks: [agent_state]
        labels: {traefik.enable: 'false'}

    agent-api:
        build:
            context: .
            dockerfile: docker/agents/Dockerfile
        image: fin-si-agent:local
        profiles: [chat]
        environment: *agent-environment
        depends_on:
            agent-postgres: {condition: service_healthy}
        healthcheck:
            test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
            interval: 10s
            timeout: 5s
            retries: 12
        networks: [chat_gateway, agent_state, agent_tools]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped
        stop_grace_period: 30s
        mem_limit: 512m

    agent-worker:
        image: fin-si-agent:local
        profiles: [chat]
        environment: *agent-environment
        command: [python, -m, finance_agent.worker]
        depends_on:
            agent-postgres: {condition: service_healthy}
            agent-mcp: {condition: service_started}
        networks: [agent_state, agent_tools, agent_egress]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped
        stop_grace_period: 130s
        mem_limit: 768m

    agent-maintenance:
        image: fin-si-agent:local
        profiles: [chat]
        environment: *agent-environment
        command: [sh, -c, "trap 'exit 0' TERM INT; while true; do python -m finance_agent.cleanup || exit 1; sleep 86400 & wait $$!; done"]
        depends_on:
            agent-postgres: {condition: service_healthy}
        networks: [agent_state]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped
        stop_grace_period: 10s
        mem_limit: 256m

    mcp-php:
        build:
            context: .
            dockerfile: docker/mcp/Dockerfile
        image: fin-si-mcp:local
        profiles: [chat]
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: ${MCP_APP_KEY:?Set MCP_APP_KEY}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
            DB_USERNAME: finance_mcp
            DB_PASSWORD: ${MCP_DATABASE_PASSWORD:?Set MCP_DATABASE_PASSWORD}
            AGENT_MCP_SERVICE_TOKEN: ${AGENT_MCP_SERVICE_TOKEN:?Set AGENT_MCP_SERVICE_TOKEN}
            MCP_LEGAL_TERMS_HASH: ${MCP_LEGAL_TERMS_HASH:-}
            MCP_LEGAL_PRIVACY_HASH: ${MCP_LEGAL_PRIVACY_HASH:-}
            LOG_CHANNEL: stderr
            SESSION_DRIVER: array
            CACHE_STORE: array
        networks: [mcp_web, mcp_finance_data]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped
        mem_limit: 512m

    agent-mcp:
        image: nginxinc/nginx-unprivileged:alpine
        profiles: [chat]
        volumes:
            - ./docker/mcp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [mcp-php]
        networks: [agent_tools, mcp_web]
        labels: {traefik.enable: 'false'}
        restart: unless-stopped

volumes:
    agent_state:

networks:
    chat_gateway: {internal: true}
    agent_state: {internal: true}
    agent_tools: {internal: true}
    mcp_web: {internal: true}
    mcp_finance_data: {internal: true}
    agent_egress: {}
