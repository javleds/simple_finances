services:
    nginx:
        container_name: simple_finances_nginx_local
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - .:/app
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - simple_finances_internal

    php:
        image: simple-finances-php:local
        container_name: simple_finances_php_local
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        environment:
            HOME: /tmp
        volumes:
            - .:/app
        depends_on:
            - mysql
        working_dir: /app
        networks:
            - simple_finances_internal

    attachments-worker:
        image: simple-finances-php:local
        restart: unless-stopped
        env_file:
            - .env
        environment:
            HOME: /tmp
        working_dir: /app
        volumes:
            - .:/app
        command: ["php", "artisan", "queue:work", "database", "--queue=attachments", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600", "--force"]
        labels:
            - "traefik.enable=false"
        mem_limit: 1g
        stop_grace_period: 90s
        depends_on:
            - php
        networks:
            - simple_finances_internal

    attachments-maintenance:
        image: simple-finances-php:local
        restart: unless-stopped
        env_file:
            - .env
        environment:
            HOME: /tmp
        working_dir: /app
        volumes:
            - .:/app
        command: ["php", "artisan", "attachments:maintain", "--interval=3600"]
        labels:
            - "traefik.enable=false"
        mem_limit: 1g
        stop_grace_period: 90s
        depends_on:
            - php
        networks:
            - simple_finances_internal

    mysql:
        container_name: simple_finances_db_local
        image: mysql:8.0
        restart: always
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - debtstb:/var/lib/mysql
        ports:
            - ${DB_PORT:-3306}:3306
        environment:
            MYSQL_ROOT_HOST: '%'
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            TZ: ${DB_TZ:-UTC}
        networks:
            - simple_finances_internal

volumes:
    debtstb:

networks:
    simple_finances_internal:
        name: simple_finances_internal
        driver: bridge
