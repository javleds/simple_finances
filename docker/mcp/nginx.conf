server {
    listen 8080;
    server_name _;
    root /workspace/apps/mcp/public;
    client_max_body_size 64k;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/apps/mcp/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass mcp-php:9000;
        fastcgi_read_timeout 130s;
        fastcgi_buffering off;
    }
}
