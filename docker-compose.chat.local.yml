services:
    nginx:
        ports:
            - '127.0.0.1:${CHAT_WEB_PORT:-8080}:80'
    mysql:
        ports: !reset []
    php:
        environment:
            APP_URL: http://127.0.0.1:${CHAT_WEB_PORT:-8080}
            SPA_URL: http://127.0.0.1:${CHAT_WEB_PORT:-8080}
            FRONTEND_URL: http://127.0.0.1:${CHAT_WEB_PORT:-8080}
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: root
            DB_PASSWORD: ${DB_PASSWORD}
